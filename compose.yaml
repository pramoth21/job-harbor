services:
  postgres:
    image: postgres:17
    container_name: job-harbor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: jobharbor
      POSTGRES_PASSWORD: jobharbor_dev
      POSTGRES_DB: jobharbor

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: